# Alembic configuration for the DataPilot API.
#
# The database URL is NOT set here: alembic/env.py uses app.database (the
# DATABASE_URL environment variable, default sqlite:///./datapilot.db), so the
# CLI, `python -m app.migrate` and API startup always migrate the same database.
#
#   cd apps/api
#   alembic upgrade head                      # apply pending revisions
#   alembic current / alembic history         # inspect
#   alembic revision --autogenerate -m "add widgets table"   # new revision (review it!)

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
