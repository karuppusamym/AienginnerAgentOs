name: datapilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot-local}
    ports:
      - "5433:5432"
    volumes:
      - datapilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - datapilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - datapilot_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 8s
      timeout: 4s
      retries: 12

  temporal:
    image: temporalio/temporal:1.8.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://datapilot:${POSTGRES_PASSWORD:-datapilot-local}@postgres:5432/datapilot
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-shared-use}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      UPLOAD_DIR: /data/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@datapilot.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      REDIS_URL: redis://redis:6379/0
      EXTERNAL_QUERY_TOOL_RATE_LIMIT_PER_MINUTE: ${EXTERNAL_QUERY_TOOL_RATE_LIMIT_PER_MINUTE:-60}
      CONNECTOR_MAX_CONCURRENT_CONNECTIONS: ${CONNECTOR_MAX_CONCURRENT_CONNECTIONS:-8}
      QDRANT_URL: http://qdrant:6333
      TEMPORAL_ADDRESS: temporal:7233
      SUPERSET_INTERNAL_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: http://localhost:8088
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-ChangeMe123!}
      SUPERSET_EDITOR_SSO_SECRET: ${SUPERSET_EDITOR_SSO_SECRET:-datapilot-local-editor-sso-secret-change-me}
      ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-false}
      TOOL_HTTP_ALLOWLIST: ${TOOL_HTTP_ALLOWLIST:-localhost,127.0.0.1,superset,mcp-toolbox}
      SQLSERVER_DEMO_CREDENTIALS: ${SQLSERVER_DEMO_CREDENTIALS:-{"server":"sqlserver-demo,1433","database":"DemoDB","username":"sa","password":"DataPilot#2026!"}}
      POSTGRES_DEMO_CREDENTIALS: ${POSTGRES_DEMO_CREDENTIALS:-{"host":"postgres-demo","port":5432,"database":"demodb","username":"demouser","password":"DemoPass#2026!"}}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-datapilot-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    volumes:
      - datapilot_uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    image: datapilot-api
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://datapilot:${POSTGRES_PASSWORD:-datapilot-local}@postgres:5432/datapilot
      TEMPORAL_ADDRESS: temporal:7233
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /data/uploads
    volumes:
      - datapilot_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

  superset:
    build:
      context: ./infra/superset
    image: datapilot-superset
    profiles: ["analytics"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-datapilot-local-superset-secret-change-me}
      SUPERSET_CONFIG_PATH: /app/datapilot/superset_config.py
      GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:-datapilot-local-guest-token-secret-change-me}
      EDITOR_SSO_JWT_SECRET: ${SUPERSET_EDITOR_SSO_SECRET:-datapilot-local-editor-sso-secret-change-me}
      SUPERSET_EDITOR_USERNAME: admin
    command:
      - /bin/sh
      - -c
      - >
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Local --lastname Admin --email admin@datapilot.local --password ${SUPERSET_ADMIN_PASSWORD:-ChangeMe123!} || true) &&
        superset init &&
        (superset import_datasources -p /app/datapilot/databases.yaml || true) &&
        gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 "superset.app:create_app()"
    ports:
      - "8088:8088"
    volumes:
      - datapilot_superset:/app/superset_home
      - ./infra/superset/databases.yaml:/app/datapilot/databases.yaml:ro
      - ./infra/superset/superset_config.py:/app/datapilot/superset_config.py:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8088/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  superset-bootstrap:
    image: python:3.12-alpine
    profiles: ["analytics"]
    command: ["python", "/bootstrap.py"]
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - ./infra/superset/bootstrap.py:/bootstrap.py:ro
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"

  # ─── Demo SQL Server 2022 ────────────────────────────────────────────────
  sqlserver-demo:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DataPilot#2026!}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - datapilot_sqlserver:/var/opt/mssql
      - ./infra/sqlserver-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD:-DataPilot#2026!} -Q 'SELECT 1' -C -b 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ─── Demo PostgreSQL 16 ───────────────────────────────────────────────────
  postgres-demo:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demodb
      POSTGRES_USER: demouser
      POSTGRES_PASSWORD: ${POSTGRES_DEMO_PASSWORD:-DemoPass#2026!}
    ports:
      - "5434:5432"
    volumes:
      - datapilot_postgres_demo:/var/lib/postgresql/data
      - ./infra/postgres-demo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demouser -d demodb"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── Google MCP Toolbox ───────────────────────────────────────────────────
  mcp-toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    command: ["--config", "/config/toolbox.yaml", "--address", "0.0.0.0", "--port", "5000"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DataPilot#2026!}
      POSTGRES_DEMO_PASSWORD: ${POSTGRES_DEMO_PASSWORD:-DemoPass#2026!}
    ports:
      - "5000:5000"
    volumes:
      - ./infra/mcp-toolbox:/config:ro
    depends_on:
      sqlserver-demo:
        condition: service_healthy
      postgres-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/5000 && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  datapilot_postgres:
  datapilot_redis:
  datapilot_qdrant:
  datapilot_uploads:
  datapilot_superset:
  datapilot_sqlserver:
  datapilot_postgres_demo:
