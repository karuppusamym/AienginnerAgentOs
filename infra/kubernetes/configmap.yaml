apiVersion: v1
kind: ConfigMap
metadata:
  name: datapilot-config
data:
  APP_ENV: production
  # Schema changes run once per release via migrate-job.yaml, not on every pod start.
  RUN_MIGRATIONS_ON_STARTUP: "false"
  STAGING_READER_ROLE: datapilot_reader
  DECISION_ROUTER_BACKEND: local
  SQL_CACHE_TTL_HOURS: "24"
  CORS_ORIGINS: https://datapilot.example.com
  UPLOAD_DIR: /data/uploads
  REDIS_URL: redis://redis.example.internal:6379/0
  EXTERNAL_QUERY_TOOL_RATE_LIMIT_PER_MINUTE: "60"
  CONNECTOR_MAX_CONCURRENT_CONNECTIONS: "8"
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "3"
  QDRANT_URL: http://qdrant.example.internal:6333
  TEMPORAL_ADDRESS: temporal.example.internal:7233
  TOOL_HTTP_ALLOWLIST: integrations.example.internal
  # HTTP tools refuse private/loopback IPs; set "true" only when the allowlisted hosts are internal services.
  TOOL_HTTP_ALLOW_PRIVATE: "false"
  TOOL_HTTP_MAX_BYTES: "1000000"
  # Two-person rule for agent runs, index DDL, prompt activation, publication, deploy and retention approvals.
  APPROVAL_SEPARATION_OF_DUTIES: "true"
  SQL_VOTE_MODE: cascade
  AGENT_RUN_MAX_SECONDS: "300"
  AGENT_PUBLISH_MIN_SCORE: "0.8"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: datapilot-api
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector.example.internal/v1/traces
